stages:
    - build

rust-latest:
    stage: build
    image: rust:latest
    script:
        - cargo build --verbose
        - cargo test --verbose
    tags:
        - share

rust-nightly:
    stage: build
    image: rustlang/rust:nightly
    script:
        - cargo build --verbose
        - cargo test --verbose
    allow_failure: true
    tags:
        - share
